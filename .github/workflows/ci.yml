name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base: también corre en PRs apilados.
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - name: Migraciones alineadas con los modelos
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic check
      - run: pytest --cov=app --cov-report=term-missing

  # Mismas migraciones y tests, pero sobre Postgres (producción corre en Neon): atrapa diferencias con SQLite.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dayflow
          POSTGRES_PASSWORD: dayflow
          POSTGRES_DB: dayflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayflow -d dayflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dayflow:dayflow@localhost:5432/dayflow_ci
      TEST_DATABASE_URL: postgresql://dayflow:dayflow@localhost:5432/dayflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migraciones hasta la última, alineadas con los modelos
        run: |
          alembic upgrade head
          alembic check
      - name: Bajar todas las migraciones y volver a subirlas
        run: |
          alembic downgrade base
          alembic upgrade head
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
